name: ECM reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ecm.txt
      - name: Install ECM dependencies
        run: python -m pip install -r requirements-ecm.txt
      - name: Numerical and artifact tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce from the shipped derived inputs
        run: python scripts/run_ecm.py --output-dir /tmp/reproduced-ecm
